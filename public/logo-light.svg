<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Icon: bold Z mark in orange square -->
  <rect width="48" height="48" rx="12" fill="#e8820c"/>
  <text x="8" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="white">Z</text>

  <!-- Wordmark — white on dark backgrounds -->
  <text x="62" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="-1" fill="white">zip</text>
  <text x="101" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="-1" fill="#e8820c">cargo</text>
</svg>
